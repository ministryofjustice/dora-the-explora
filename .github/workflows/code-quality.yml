---
name: Code Quality

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize]
  schedule:
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

permissions: {}

jobs:
  code-quality:
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
      security-events: write
    uses: ministryofjustice/modernisation-platform-github-actions/.github/workflows/reusable-code-quality.yml@09f7bbe4b51fbdfc068014571c201d2c5b3704c0 # v6.3.0
    with:
      validate_all_codebase: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
