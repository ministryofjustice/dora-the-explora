---
name: DORA Metrics Workflow

"on":
  workflow_dispatch:
    inputs:
      date_range:
        description: "Date range for metrics (format: YYYY-MM-DD..YYYY-MM-DD)"
        required: false
      json_file_path:
        description: "Path to the JSON file with repository names"
        required: false
  schedule:
    - cron: "0 8 * * 0" # At 08:00 on Sunday

concurrency:
  group: generate-metrics
  cancel-in-progress: false

permissions: {}

jobs:
  run_metrics:
    permissions:
      issues: write
      contents: read
      pull-requests: read
      id-token: write # Required for the Octo STS OIDC exchange
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Obtain Octo STS token
        # Mints a short-lived, org-wide read token (replacing a long-lived PAT)
        # to read workflow runs, pull requests and commits across the team repos
        # listed in the manifests. Requires the org-level trust policy in
        # ministryofjustice/.github (.github/chainguard/ministryofjustice-dora-the-explora.sts.yaml).
        id: octo_sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ministryofjustice
          identity: ministryofjustice-dora-the-explora

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --no-dev --locked

      - name: Set date range
        env:
          DATE_RANGE: ${{ inputs.date_range }}
        run: |
          if [ -n "$DATE_RANGE" ]; then
            if [[ ! "$DATE_RANGE" =~ ^([0-9]{4}-[0-9]{2}-[0-9]{2})\.\.([0-9]{4}-[0-9]{2}-[0-9]{2})$ ]]; then
              echo "ERROR: date_range must use YYYY-MM-DD..YYYY-MM-DD format" >&2
              exit 1
            fi

            start_date="${BASH_REMATCH[1]}"
            end_date="${BASH_REMATCH[2]}"

            if ! date -u --date="$start_date" '+%Y-%m-%d' >/dev/null 2>&1; then
              echo "ERROR: Invalid start date: $start_date" >&2
              exit 1
            fi

            if ! date -u --date="$end_date" '+%Y-%m-%d' >/dev/null 2>&1; then
              echo "ERROR: Invalid end date: $end_date" >&2
              exit 1
            fi

            if [[ "$start_date" > "$end_date" ]]; then
              echo "ERROR: Start date must not be later than end date" >&2
              exit 1
            fi
          else
            start_date=$(date -u +%Y-%m-%d --date='7 days ago')
            end_date=$(date -u +%Y-%m-%d)
          fi

          echo "START_DATE=$start_date" >> "$GITHUB_ENV"
          echo "END_DATE=$end_date" >> "$GITHUB_ENV"

      - name: Run scripts and create issues
        env:
          ACCESS_TOKEN: ${{ steps.octo_sts.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          JSON_FILE_PATH: ${{ inputs.json_file_path }}
        run: |
          # Determine list of JSON files to process
          if [ -n "$JSON_FILE_PATH" ]; then
            json_files=("$JSON_FILE_PATH")
          else
            json_files=(*.json)
          fi

          for json_file in "${json_files[@]}"; do
            name=$(basename "$json_file" .json)
            issue_title="📊 DORA Metrics for $START_DATE..$END_DATE for $name"
            issue_body=""

            for script in cfr.py df.py ltfc.py mttr.py; do
              uv run python "$script" "$json_file" "$START_DATE..$END_DATE"
              output=$(<output.log)
              rm -f output.log
              # Each script already labels its own output; separate metrics with a blank line.
              issue_body+="$output"$'\n'
            done

            if [ "$GITHUB_ACTIONS" = "true" ]; then
              gh issue create --title "$issue_title" --body "$issue_body"
            else
              echo "Skipping issue creation because running outside GitHub Actions."
            fi
          done
