name: MPE DORA Metrics

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Earliest deployment date to consider (YYYY-MM-DD)'
        required: false
      apps:
        description: 'Comma-separated app names (default: all MPE apps)'
        required: false
  schedule:
    - cron: '0 8 * * 1' # At 08:00 on Monday

concurrency:
  group: mpe-dora
  cancel-in-progress: false

permissions: {}

jobs:
  mpe_dora:
    permissions:
      issues: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --no-dev --locked

      - name: Default the since date (90 days ago) when not supplied
        if: github.event.inputs.since == ''
        run: echo "since=$(date -u +%Y-%m-%d --date='90 days ago')" >> $GITHUB_ENV

      - name: Use the supplied since date
        if: github.event.inputs.since != ''
        run: echo "since=${{ github.event.inputs.since }}" >> $GITHUB_ENV

      - name: Run MPE DORA and create an issue
        env:
          ACCESS_TOKEN: ${{ secrets.DATA_PLATFORM_ROBOT_PAT }}
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ env.since }}
          APPS: ${{ github.event.inputs.apps }}
        run: |
          args=(--since "$SINCE")
          if [ -n "$APPS" ]; then
            args+=(--apps "$APPS")
          fi
          uv run python mpe_dora.py "${args[@]}"
          body=$(cat output.log)
          rm -f output.log
          gh issue create \
            --title "📊 MPE DORA Metrics (deployments since $SINCE)" \
            --body "$body"
