name: MPE DORA Metrics

on:
  workflow_dispatch:
    inputs:
      since:
        description: 'Earliest deployment date to consider (YYYY-MM-DD)'
        required: false
      apps:
        description: 'Comma-separated app names (default: all MPE apps)'
        required: false
  schedule:
    - cron: '0 8 * * 1' # At 08:00 on Monday

concurrency:
  group: mpe-dora
  cancel-in-progress: false

permissions: {}

jobs:
  mpe_dora:
    permissions:
      issues: write
      contents: read
      id-token: write # required for the Octo STS OIDC exchange
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Obtain Octo STS token
        # Mints a short-lived token to read modernisation-platform-environments,
        # replacing a long-lived PAT. Requires a trust policy in that repo at
        # .github/chainguard/ministryofjustice-dora-the-explora.sts.yaml.
        id: octo_sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: ministryofjustice/modernisation-platform-environments
          identity: ministryofjustice-dora-the-explora

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: uv sync --no-dev --locked

      - name: Default the since date (90 days ago) when not supplied
        if: github.event.inputs.since == ''
        run: echo "since=$(date -u +%Y-%m-%d --date='90 days ago')" >> $GITHUB_ENV

      - name: Use the supplied since date
        if: github.event.inputs.since != ''
        run: echo "since=${{ github.event.inputs.since }}" >> $GITHUB_ENV

      - name: Run MPE DORA and create an issue
        env:
          ACCESS_TOKEN: ${{ steps.octo_sts.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          SINCE: ${{ env.since }}
          APPS: ${{ github.event.inputs.apps }}
        run: |
          args=(--since "$SINCE")
          if [ -n "$APPS" ]; then
            args+=(--apps "$APPS")
          fi
          uv run python mpe_dora.py "${args[@]}"
          body=$(cat output.log)
          rm -f output.log
          gh issue create \
            --title "📊 MPE DORA Metrics (deployments since $SINCE)" \
            --body "$body"
